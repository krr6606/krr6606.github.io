<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>기술 문서 고치기</title>
<link rel="icon" href="data:," />
<!-- 기술 문서 편집 화면 — 편집 서버(python editor/server.py)로 열었을 때만 동작합니다: /editor/doc-edit.html?p=<src 폴더 이름>
     왼쪽 = 기술 문서(.md) 원문, 오른쪽 = 상세 기술문서 페이지(doc.html) 미리보기. CDN은 버전 고정(CodeMirror 5.65.16, Pretendard v1.3.9, D2Coding 1.3.2) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/d2coding@1.3.2/d2coding-subset.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css" />
<link rel="stylesheet" href="edit.css" />
</head>
<body class="pfe pfe-shell">
<header class="pfe-bar">
  <a id="back" href="/index.html">← 돌아가기</a>
  <select id="proj" aria-label="프로젝트"></select>
  <span class="pfe-sep"></span>
  <button type="button" class="pfe-mini" data-do="h" title="제목(누를 때마다 ## → ### → #### → 없음)">제목</button>
  <button type="button" class="pfe-mini" data-do="b" title="굵게 (Ctrl+B)"><b>굵게</b></button>
  <button type="button" class="pfe-mini" data-do="c" title="코드 글자 (Ctrl+E)">`코드`</button>
  <button type="button" class="pfe-mini" data-do="link" title="링크 (Ctrl+K)">링크</button>
  <button type="button" class="pfe-mini" data-do="ul" title="목록">목록</button>
  <button type="button" class="pfe-mini" data-do="table" title="표 넣기">표</button>
  <button type="button" class="pfe-mini" data-do="code" title="코드 블록 넣기">코드 블록</button>
  <button type="button" class="pfe-mini" data-do="mmd" title="Mermaid 다이어그램 넣기">다이어그램</button>
  <button type="button" class="pfe-mini" data-do="img" title="그림 넣기 — 그림을 붙여 넣거나(Ctrl+V) 끌어다 놓아도 됩니다">그림</button>
  <span class="pfe-sp"></span>
  <span class="pfe-status" id="status" role="status">불러오는 중…</span>
  <button type="button" id="revert" title="저장하지 않은 고친 글을 버리고 파일을 다시 읽습니다">다시 읽기</button>
  <button type="button" class="pfe-primary" id="save" title="Ctrl+S" disabled>저장</button>
</header>
<div class="pfe-split" id="split">
  <section class="pfe-src" id="src" aria-label="기술 문서 원문"></section>
  <div class="pfe-divider" id="divider" role="separator" aria-orientation="vertical" title="끌어서 폭 바꾸기"></div>
  <section class="pfe-view" aria-label="미리보기"><iframe id="view" title="상세 기술문서 미리보기"></iframe></section>
</div>
<div class="pfe-note" id="note">오른쪽 미리보기에서 글·표·코드를 누르면 왼쪽 원문의 그 자리로 갑니다. 고치면 미리보기가 바로 바뀌고, [저장](Ctrl+S)을 눌러야 파일에 남습니다.</div>
<dialog class="pfe pfe-dlg" id="imgdlg" aria-label="그림 넣기">
  <div class="pfe-line"><b class="pfe-grow">그림 넣기</b>
    <label class="pfe-line"><input type="file" id="imgfile" accept=".png,.jpg,.jpeg,.gif,.webp,.svg,.mp4,.webm" hidden /><span class="pfe-tag" style="cursor:pointer;padding:6px 12px">+ 새 그림 올리기</span></label>
    <button type="button" id="imgclose">닫기</button></div>
  <small>이 프로젝트의 images/ 폴더에 있는 그림입니다. 누르면 글에 들어갑니다.</small>
  <div class="pfe-grid" id="imggrid"></div>
</dialog>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/markdown/markdown.min.js"></script>
<script src="doc-edit.js"></script>
</body>
</html>
