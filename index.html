<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>포트폴리오</title>
<script>
  /* 첫 화면은 custom/ 페이지(스크롤 색 전환 · 프로젝트 모음)로 보냄. 이 페이지(인쇄용 · 제출 PDF)는 ?classic=1로 열림.
     예전 주소 #s=…·#번호와 점검용 ?pf-audit=1은 이 페이지에 그대로 둠. /portfolio-update로 이 파일이 바뀌면 이 블록을 다시 넣어야 함 */
  (function () {
    var q = location.search, h = location.hash;
    if (/[?&](classic|pf-audit)=/.test(q)) return;
    if (h && !/^#(cover|intro|stack|glance|contact|works|p-[^/]+)$/.test(h)) return;
    location.replace('custom/' + h);
  })();
</script>
<link rel="icon" href="data:," /><!-- 아이콘 파일 없음: 브라우저가 /favicon.ico를 요청해 404가 나지 않게 -->
<!-- 고정 렌더러 — 포트폴리오 페이지(아래로 읽는 한 페이지, A4 인쇄 = 제출 PDF). 내용은 data/portfolio.json · data/projects/*.json에서 읽습니다. 이 파일은 고치지 않아도 됩니다.
     주소: #<절 id>(cover · intro · stack · p-<폴더> · p-<폴더>-core · glance · contact). 예전 포트폴리오 슬라이드 주소(#s=<장면 id> · #<번호>)는 같은 절로 넘어갑니다.
     슬라이드는 project.html?p=<폴더>, 프로젝트 상세 문서는 doc.html?p=<폴더>. CDN은 버전 고정(Pretendard v1.3.9, Montserrat 5.2.8 — 영문 라벨, D2Coding 1.3.2) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/montserrat@5.2.8/latin-700.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/montserrat@5.2.8/latin-800.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/d2coding@1.3.2/d2coding-subset.css" />
<link rel="stylesheet" href="assets/portfolio.css" />
<link rel="stylesheet" href="theme/theme.css" /><!-- 테마(색·모양·영문 글꼴): /portfolio-theme가 씀. /portfolio-update가 건드리지 않음 -->
</head>
<body>
<a class="skip-link" href="#main">본문으로 건너뛰기</a>
<div id="app"><p class="loading">불러오는 중…</p></div>
<noscript><div class="notice"><h1>JavaScript를 켜 주세요</h1><p>이 포트폴리오는 data/의 내용을 읽어 브라우저에서 그립니다. JavaScript를 켠 뒤 다시 열어 주세요.</p></div></noscript>
<script src="assets/strings.js"></script><!-- UI 문구 표(기본 문구) + theme/strings.tsv(내 문구) 읽기. common.js보다 먼저 -->
<script src="assets/common.js"></script>
<script src="assets/portfolio.js"></script>
</body>
</html>
